name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ["5.1", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - name: Parse every Lua file
        run: |
          set -e
          find . -name '*.lua' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            lua${{ matrix.lua }} -e "assert(loadfile(arg[1]))" "$f"
          done
      - name: Run tests
        run: lua${{ matrix.lua }} tests/run.lua

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks lua5.1 && sudo luarocks install luacheck
      - name: Luacheck
        run: luacheck . --no-color --codes
